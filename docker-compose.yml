services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prior_auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prior_auth}
      POSTGRES_DB: ${POSTGRES_DB:-prior_auth}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prior_auth} -d ${POSTGRES_DB:-prior_auth}"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-prior_auth}:${POSTGRES_PASSWORD:-prior_auth}@postgres:5432/${POSTGRES_DB:-prior_auth}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-in-production-32-bytes-min}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-480}
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"

volumes:
  pgdata:
